name: OIDC Learning Test

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show GitHub identity
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Owner ID: ${{ github.repository_owner_id }}"
          echo "Ref: ${{ github.ref }}"

      - name: Request and validate OIDC token
        run: |
          OIDC_RESPONSE=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_RESPONSE")
          OIDC_TOKEN="$OIDC_TOKEN" python - <<'PY'
          import base64
          import json
          import os

          parts = os.environ["OIDC_TOKEN"].split(".")
          if len(parts) != 3:
              raise SystemExit("Invalid OIDC token format")

          payload = parts[1] + "=" * (-len(parts[1]) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(f"OIDC sub: {claims.get('sub')}")
          print(f"OIDC aud: {claims.get('aud')}")

          if claims.get("aud") != "sts.amazonaws.com":
              raise SystemExit("Unexpected OIDC audience")
          PY
